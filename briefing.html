<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0a">
<title>Утренний брифинг</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{color-scheme:dark}
html,body{background:#0a0a0a;color:#e8e8e8;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
body{padding:16px;padding-top:calc(16px + env(safe-area-inset-top));padding-bottom:calc(24px + env(safe-area-inset-bottom))}
.h1row{display:flex;align-items:center;justify-content:space-between;margin-bottom:2px}
h1{font-size:26px;font-weight:800}
.refresh{width:auto;padding:8px 14px;font-size:18px;background:linear-gradient(180deg,#243050,#1a2340);color:#a8b8ff;border:1px solid rgba(168,184,255,.25);border-radius:10px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 8px rgba(0,0,0,.4);transition:transform .08s,box-shadow .15s}
.refresh:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 3px rgba(0,0,0,.4)}
.date{color:#888;font-size:13px;margin-bottom:16px}
.card{background:#161616;border:1px solid rgba(255,255,255,.07);border-radius:16px;padding:16px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.card h3{font-size:15px;letter-spacing:2px;text-transform:uppercase;color:#888;margin-bottom:10px}
.wrow{display:flex;align-items:center;gap:14px}
.wtemp{font-size:44px;font-weight:800;color:#4a6bff;text-shadow:0 0 18px rgba(74,107,255,.45)}
.wsub{color:#bbb;font-size:14px;line-height:1.5}
.ev{padding:8px 0;border-bottom:1px solid #1f1f1f;font-size:15px}
.ev:last-child{border-bottom:none}
.ev b{color:#d4af37}
.quote{font-style:italic;color:#c9b57f}
.err{color:#888;font-size:14px}
.retry{margin-top:10px;background:linear-gradient(180deg,#243050,#1a2340);color:#a8b8ff;border:1px solid rgba(168,184,255,.25);border-radius:10px;padding:10px 16px;font-size:14px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.10),0 2px 8px rgba(0,0,0,.4);transition:transform .08s,box-shadow .15s}
.retry:active{transform:translateY(1px);box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 1px 3px rgba(0,0,0,.4)}
</style>
</head>
<body>
<div class="h1row"><h1>📰 Утренний брифинг</h1><button class="refresh" onclick="location.reload()">⟳</button></div>
<div class="date" id="dline"></div>
<div id="feed"></div>
<script>
window.onerror = function(msg, src, line){
  const f = document.getElementById('feed');
  if(f) f.innerHTML = '<div class="card"><h3>Сбой в коде</h3><div class="err">' + msg + ' (строка ' + line + ')</div><button class="retry" onclick="location.reload()">Обновить</button></div>';
};

const D = new Date();
document.getElementById('dline').textContent = D.toLocaleDateString('ru-RU',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const pad = n => String(n).padStart(2,'0');
const MM = pad(D.getMonth()+1), DD = pad(D.getDate());
const MGEN = ['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const QUOTES = [
 'Император защищает тех, кто защищает себя железом.',
 'Боль — это пошлина прогрессу. Плати её полностью.',
 'Штанга не лжёт. Это единственная честная вещь в галактике.',
 'Отдых — тоже служба. Вымотанный солдат есть мёртвый солдат.',
 'Бросай штангу громко: пусть рекруты знают, что старик ещё в строю.'
];

const WMO = {0:'ясно, небо чистое',1:'в основном ясно',2:'переменная облачность',3:'пасмурно',45:'туман',48:'изморозь',51:'лёгкая морось',53:'морось',55:'сильная морось',61:'небольшой дождь',63:'дождь',65:'сильный дождь',71:'небольшой снег',73:'снег',75:'сильный снег',80:'ливни',81:'ливни',82:'сильные ливни',95:'гроза',96:'гроза с градом',99:'гроза с градом'};
const wemo = c => c<=1?'☀️':c<=2?'⛅':c<=3?'☁️':c<=48?'🌫':c<=57?'🌦':c<=67?'🌧':c<=77?'❄️':c<=82?'🌧':c<=99?'⛈':'';

const MET_DESC = {
  clearsky:'ясно, небо чистое', fair:'малооблачно', partlycloudy:'переменная облачность', cloudy:'пасмурно',
  fog:'туман', lightrain:'небольшой дождь', rain:'дождь', heavyrain:'сильный дождь',
  lightrainshowers:'небольшой дождь порывами', rainshowers:'дождь порывами', heavyrainshowers:'сильный дождь порывами',
  lightsleet:'небольшой мокрый снег', sleet:'мокрый снег', heavysleet:'сильный мокрый снег',
  lightsnow:'небольшой снег', snow:'снег', heavysnow:'сильный снег', snowshowers:'снег порывами',
  lightrainandthunder:'небольшой дождь с грозой', rainandthunder:'дождь с грозой', heavyrainandthunder:'сильный дождь с грозой',
  lightrainshowersandthunder:'ливни с грозой', rainshowersandthunder:'ливни с грозой', heavyrainshowersandthunder:'сильные ливни с грозой',
  lightsleetandthunder:'мокрый снег с грозой', sleetandthunder:'мокрый снег с грозой', heavysleetandthunder:'мокрый снег с грозой',
  lightsnowandthunder:'снег с грозой', snowandthunder:'снег с грозой', heavysnowandthunder:'снег с грозой',
  snowshowersandthunder:'снег порывами с грозой'
};
const MET_EMO = c => /thunder/.test(c)?'⛈':/sleet|snow/.test(c)?'❄️':/rain/.test(c)?(/heavy/.test(c)?'🌧':''):c==='fog'?'🌫':c==='cloudy'?'☁️':c==='partlycloudy'?'⛅':c==='fair'?'🌤':'☀️';

document.getElementById('feed').innerHTML =
  '<div class="card" id="c-weather"><h3>Питер сейчас</h3><div class="err">🌦 Смотрю погоду…</div></div>' +
  '<div class="card" id="c-hist"><h3>В этот день в истории</h3><div class="err">📜 Листаю архивы…</div></div>' +
  '<div class="card"><h3>Мысль дня</h3><div class="quote">«' + QUOTES[(D.getDate()+D.getMonth())%QUOTES.length] + '»</div></div>';

function fetchJson(url, ms){
  return Promise.race([
    fetch(url).then(r => { if(!r.ok) throw new Error('HTTP ' + r.status); return r.json(); }),
    new Promise((_, rej) => setTimeout(() => rej(new Error('таймаут')), ms || 7000))
  ]);
}
function setCard(id, html){ const el = document.getElementById(id); if(el) el.outerHTML = html; }

async function openMeteo(){
  const j = await fetchJson('https://api.open-meteo.com/v1/forecast?latitude=59.93&longitude=30.33&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FMoscow&forecast_days=1');
  const c = j.current, d = j.daily;
  return `<div class="card" id="c-weather"><h3>Питер сейчас</h3><div class="wrow"><div class="wtemp">${Math.round(c.temperature_2m)}°</div><div class="wsub">${wemo(c.weather_code)} ${WMO[c.weather_code]||'погода'}<br>ощущается как ${Math.round(c.apparent_temperature)}°, ветер ${Math.round(c.wind_speed_10m)} м/с</div></div><div class="wsub" style="margin-top:8px">днём ${Math.round(d.temperature_2m_max[0])}° / ночью ${Math.round(d.temperature_2m_min[0])}°, шанс осадков ${d.precipitation_probability_max[0]}%</div></div>`;
}

async function metNo(){
  const j = await fetchJson('https://api.met.no/weatherapi/locationforecast/2.0/compact?lat=59.93&lon=30.33');
  const ts = j.properties && j.properties.timeseries;
  if(!ts || !ts.length) throw new Error('пустой ответ');
  const now = ts[0].data.instant.details;
  const symRaw = (ts[0].data.next_1_hours && ts[0].data.next_1_hours.summary.symbol_code) ||
                 (ts[0].data.next_6_hours && ts[0].data.next_6_hours.summary.symbol_code) || 'cloudy';
  const base = symRaw.replace(/_(day|night|polartwilight)$/,'');
  const temps = ts.slice(0,24).map(t => t.data.instant.details.air_temperature);
  const mx = Math.max(...temps), mn = Math.min(...temps);
  let prob = 0;
  ts.slice(0,4).forEach(t => { const p = t.data.next_6_hours && t.data.next_6_hours.details && t.data.next_6_hours.details.precipitation_probability; if(p != null) prob = Math.max(prob, p); });
  const t = now.air_temperature, w = now.wind_speed;
  let feel = t;
  if(t <= 10 && w >= 1.5){ const v = w * 3.6; feel = 13.12 + 0.6215*t - 11.37*Math.pow(v,0.16) + 0.396*t*Math.pow(v,0.16); }
  return `<div class="card" id="c-weather"><h3>Питер сейчас</h3><div class="wrow"><div class="wtemp">${Math.round(t)}°</div><div class="wsub">${MET_EMO(base)} ${MET_DESC[base]||'погода'}<br>ощущается как ${Math.round(feel)}°, ветер ${Math.round(w)} м/с</div></div><div class="wsub" style="margin-top:8px">ближайшие сутки: днём ${Math.round(mx)}° / ночью ${Math.round(mn)}°, шанс осадков ${prob}%</div><div class="err" style="margin-top:6px">источник: met.no (запасной)</div></div>`;
}

async function loadWeather(){
  setCard('c-weather', '<div class="card" id="c-weather"><h3>Питер сейчас</h3><div class="err">🌦 Смотрю погоду…</div></div>');
  try { setCard('c-weather', await openMeteo()); return; } catch(e){}
  try { setCard('c-weather', await metNo()); return; } catch(e){}
  setCard('c-weather', `<div class="card" id="c-weather"><h3>Питер сейчас</h3><div class="err">Оба источника погоды молчат: и open-meteo, и met.no. Такое бывает раз в год, и сегодня тот день.</div><button class="retry" onclick="loadWeather()">Повторить</button></div>`);
}

async function loadHistory(){
  setCard('c-hist', '<div class="card" id="c-hist"><h3>В этот день в истории</h3><div class="err">📜 Листаю архивы…</div></div>');
  const show = (evs, note) => setCard('c-hist', `<div class="card" id="c-hist"><h3>В этот день в истории${note?' · '+note:''}</h3>${evs.map(e=>`<div class="ev"><b>${e[0]}</b> — ${e[1]}</div>`).join('')}</div>`);
  try{
    const j = await fetchJson(`https://ru.wikipedia.org/api/rest_v1/feed/onthisday/selected/${MM}/${DD}`);
    const evs = (j.events||[]).slice(0,5);
    if(evs.length){ show(evs.map(e=>[e.year,e.text])); return; }
  }catch(e){}
  try{
    const j = await fetchJson(`https://ru.wikipedia.org/api/rest_v1/feed/onthisday/all/${MM}/${DD}`);
    const evs = (j.events||[]).slice(0,5);
    if(evs.length){ show(evs.map(e=>[e.year,e.text])); return; }
  }catch(e){}
  try{
    const page = encodeURIComponent(D.getDate() + ' ' + MGEN[D.getMonth()]);
    const j = await fetchJson(`https://ru.wikipedia.org/w/api.php?action=parse&page=${page}&prop=text&format=json&formatversion=2&origin=*`);
    const doc = new DOMParser().parseFromString(j.parse.text, 'text/html');
    const h2 = [...doc.querySelectorAll('h2')].find(x => /События/i.test(x.textContent));
    let ul = h2 ? h2.nextElementSibling : null;
    while(ul && ul.tagName !== 'UL') ul = ul.nextElementSibling;
    if(ul){
      const evs = [...ul.querySelectorAll('li')].slice(0,5).map(li=>{
        const t = li.textContent.replace(/\[\d+\]/g,'').replace(/\s+/g,' ').trim();
        const m = t.match(/^([0-9]+)\s*[—-]\s*(.*)$/);
        return m ? [m[1], m[2]] : ['…', t];
      });
      if(evs.length){ show(evs); return; }
    }
  }catch(e){}
  try{
    const j = await fetchJson(`https://en.wikipedia.org/api/rest_v1/feed/onthisday/selected/${MM}/${DD}`);
    const evs = (j.events||[]).slice(0,5);
    if(evs.length){ show(evs.map(e=>[e.year,e.text]), 'оригинал на английском'); return; }
  }catch(e){}
  setCard('c-hist', `<div class="card" id="c-hist"><h3>В этот день в истории</h3><div class="err">Архивы молчат на всех четырёх уровнях подхода.</div><button class="retry" onclick="loadHistory()">Повторить</button></div>`);
}

window.loadWeather = loadWeather;
window.loadHistory = loadHistory;
loadWeather();
loadHistory();
</script>
</body>
</html>

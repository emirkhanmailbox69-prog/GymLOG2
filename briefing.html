function getDayOfYear() {
  const start = new Date(D.getFullYear(), 0, 0);
  const diff = D - start;
  return Math.floor(diff / (1000 * 60 * 60 * 24));
}

async function getInterestingFact() {
  try {
    // Запрашиваем все события за сегодня из Википедии
    const res = await fetch(`https://ru.wikipedia.org/api/rest_v1/feed/onthisday/all/${MM}/${DD}`);
    if (!res.ok) throw new Error('Wiki fail');
    const data = await res.json();
    
    // Фильтр мрачных слов. Если в тексте есть хоть одно из них — событие отбрасывается.
    const badWords = ['умер', 'погиб', 'война', 'теракт', 'убийств', 'катастроф', 'расстрел', 'казнь', 'трагедия', 'смерть', 'казнен', 'похоронен', 'убит', 'пожар', 'авария', 'крушение'];
    
    const goodEvents = (data.events || []).filter(e => {
      const text = e.text.toLowerCase();
      return !badWords.some(word => text.includes(word)) && text.length > 20 && text.length < 300;
    });

    // Если нашли что-то хорошее — берем случайное из подходящих
    if (goodEvents.length > 0) {
      const pick = goodEvents[Math.floor(Math.random() * goodEvents.length)];
      return `<div class="card"><h3>В этот день в истории</h3><div class="ev"><b>${pick.year} год:</b> ${pick.text}</div></div>`;
    }
  } catch (e) {
    console.log('Wiki fact failed, falling back to local');
  }

  // Если Википедия подкинула только мрачные события или отвалилась — берем из локальной базы по дню года
  const fact = FUN_FACTS[getDayOfYear() % FUN_FACTS.length];
  return `<div class="card"><h3>А вот это интересно</h3><div class="ev">${fact}</div></div>`;
}

async function weather(){
  try{
    const r = await fetch('https://api.open-meteo.com/v1/forecast?latitude=59.93&longitude=30.33&current=temperature_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Europe%2FMoscow&forecast_days=1');
    const j = await r.json();
    const c = j.current, d = j.daily;
    return `<div class="card"><h3>Питер сейчас</h3><div class="wrow"><div class="wtemp">${Math.round(c.temperature_2m)}°</div><div class="wsub">${wemo(c.weather_code)} ${WMO[c.weather_code]||'погода'}<br>ощущается как ${Math.round(c.apparent_temperature)}°, ветер ${Math.round(c.wind_speed_10m)} м/с</div></div><div class="wsub" style="margin-top:8px">днём ${Math.round(d.temperature_2m_max[0])}° / ночью ${Math.round(d.temperature_2m_min[0])}°, шанс осадков ${d.precipitation_probability_max[0]}%</div></div>`;
  }catch(e){ return `<div class="card"><h3>Питер сейчас</h3><div class="err">Погода не отвечает. Выгляни в окно — надёжнее.</div></div>`; }
}

function quote(){
  return `<div class="card"><h3>Мысль дня</h3><div class="quote">«${QUOTES[(D.getDate()+D.getMonth())%QUOTES.length]}»</div></div>`;
}

(async()=>{
  const w = await weather();
  const fact = await getInterestingFact();
  document.getElementById('feed').innerHTML = w + fact + quote();
})();
</script>
